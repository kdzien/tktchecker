name: Run script

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      ENV_MAIL: ${{ secrets.ENV_MAIL }}
      ENV_PASS: ${{ secrets.ENV_PASS }}
      ENV_URL: ${{ secrets.ENV_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Patchright Chromium
        run: npx patchright install --with-deps chromium

      - name: Run script
        run: npm run start
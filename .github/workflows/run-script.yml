name: Run script

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      ENV_MAIL: ${{ secrets.ENV_MAIL }}
      ENV_PASS: ${{ secrets.ENV_PASS }}
      ENV_URL: ${{ secrets.ENV_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Patchright browsers
        id: patchright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: patchright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            patchright-browsers-${{ runner.os }}-

      - name: Install Patchright Chromium
        if: steps.patchright-cache.outputs.cache-hit != 'true'
        run: npx patchright install --with-deps chromium

      - name: Run script
        run: xvfb-run -a npm run start
